name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15          # fail fast if a --smoke run deadlocks, instead of hanging to the 6h cap
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 for the tags. VersionFromGitTag in the csproj derives the version from
        # `git describe --tags`, and checkout clones shallow WITHOUT tags by default — so the
        # build would silently stamp VersionFallback instead of the release being built.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # --minimum-expected-tests is Microsoft.Testing.Platform's own guard against a silent/partial
      # test run. A floor of 1 only catches zero tests; use a realistic floor so a broken adapter
      # that discovers a handful cannot pass. Raise this when adding tests, never lower it.
      # Do NOT add --nologo here: the .NET 10 SDK doesn't claim that option yet, so it gets forwarded
      # verbatim to the test app and kills the run (exit 5) before a single test is seen.
      - name: Test (Core)
        run: dotnet test --project tests/QuickText.Core.Tests -c Release --minimum-expected-tests 385
      - name: Test (App)
        run: dotnet test --project tests/QuickText.App.Tests -c Release --minimum-expected-tests 5
      - name: Build (App)
        run: dotnet build src/QuickText.App -c Release --nologo
      - name: Test package validation
        shell: pwsh
        run: ./tools/tests/package-release.Tests.ps1
      - name: Smoke (parse every window's XAML)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/QuickText.App/bin/Release -Recurse -Filter QuickText.exe | Select-Object -First 1
          if (-not $exe) { Write-Error 'QuickText.exe not found'; exit 1 }
          # Portable mode also isolates the library, which otherwise defaults to Documents.
          $sandbox = Join-Path ([IO.Path]::GetTempPath()) ("QuickText-ci-" + [guid]::NewGuid())
          $appDirectory = Join-Path $sandbox 'app'
          $tempDirectory = Join-Path $sandbox 'temp'
          New-Item -ItemType Directory -Path $appDirectory,$tempDirectory -Force | Out-Null
          Copy-Item -Path (Join-Path $exe.DirectoryName '*') -Destination $appDirectory -Recurse -Force
          New-Item -ItemType File -Path (Join-Path $appDirectory 'QuickText.portable') | Out-Null
          $marker = Join-Path $tempDirectory 'quicktext-smoke.txt'
          $p = Start-Process (Join-Path $appDirectory 'QuickText.exe') -ArgumentList '--smoke' -WorkingDirectory $appDirectory -WindowStyle Hidden -PassThru -Environment @{APPDATA=$sandbox; LOCALAPPDATA=$sandbox; TEMP=$tempDirectory; TMP=$tempDirectory}
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Window smoke timed out' }
          # The 'OK' marker the app writes is the reliable success signal; a WPF ExitCode can come back
          # $null via Start-Process, so only an EXPLICIT non-zero code counts as failure.
          $ok = (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq 'OK')
          Write-Host "smoke: exit=$($p.ExitCode) marker=$ok"
          if (-not $ok -or ($p.ExitCode -and $p.ExitCode -ne 0)) { exit 1 }

  # One file, two jobs: `needs: test` is what makes a red tree unable to produce a release, and it
  # costs nothing extra because the same run already did the testing. Splitting this into ci.yml +
  # release.yml would lose that — `needs:` does not reach across workflow files.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
    permissions:
      contents: write        # creating the Release
      id-token: write        # the attest step below: exchange an OIDC token to sign the provenance
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 for the tags. VersionFromGitTag in the csproj derives the version from
        # `git describe --tags`, and checkout clones shallow WITHOUT tags by default — so the
        # build would silently stamp VersionFallback instead of the release being built.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $versions = choco search innosetup --exact --all-versions --limit-output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = $versions | ForEach-Object { if ($_ -match '^innosetup\|(6\.\d+\.\d+)$') { [version]$Matches[1] } } | Sort-Object -Descending | Select-Object -First 1
          if (-not $version) { throw 'No stable Inno Setup 6.x available' }
          choco install innosetup --version="$version" --allow-downgrade --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and verify release packages
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected stable vX.Y.Z tag' }
          ./tools/release.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt
      - name: Compose release body
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $notesPath = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notesPath)) {
            Write-Error "No release notes at $notesPath - write the 'What's new' bullets for $tag before tagging."
            exit 1
          }
          # -Raw, not a line array: the bullets have to land in the body exactly as they were
          # written. -Encoding utf8 because the notes carry CJK, and a PowerShell that guesses
          # the encoding turns them into mojibake.
          $notes = (Get-Content $notesPath -Raw -Encoding utf8).TrimEnd()
          # Single-quoted here-string, so PowerShell interpolates nothing: the markdown is full of
          # backticks (the code fence), and the tag expression is expanded by Actions before the
          # shell ever sees this script.
          $tail = @'
          **Which package? / 下载哪个？**

          - `QuickText-…-setup.exe` — Installer with runtime included. / 含运行时的安装包。
          - `QuickText-…-win-arm64.zip` — Self-contained portable for Windows on Arm. / ARM64 自包含便携版。
          - `QuickText-…-win-arm64-needs-dotnet10.zip` — Requires .NET 10 Desktop Runtime for ARM64. / ARM64 框架依赖精简版。

          - `QuickText-${{ github.ref_name }}-win-x64.zip` — .NET runtime included; unzip and run on any Windows 10/11 x64. Take this if you're unsure. / 内含 .NET 运行时，解压即用；拿不准、内网机、离线机、U 盘随身带就选它。
          - `QuickText-${{ github.ref_name }}-win-x64-needs-dotnet10.zip` — same app without the bundled runtime; needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) installed. / 同一个程序，只是不带运行时；需要电脑上已装 [.NET 10 桌面运行时](https://dotnet.microsoft.com/download/dotnet/10.0)。

          **Verify your download / 校验下载** — the exe isn't code-signed. Two ways, pick either: / 程序没有代码签名，两种校验方式任选：

          ```
          gh attestation verify <file> -R rockbenben/QuickText   # proves it was built by this repo / 证明由本仓库构建
          certutil -hashfile <file> SHA256                        # compare against SHA256SUMS.txt / 与 SHA256SUMS.txt 比对
          ```
          '@
          # utf8 is BOM-less in PowerShell 7; a BOM would land in the release body as a stray
          # character in front of the first heading. The trailing newline is deliberate: GitHub
          # appends its own blank line before the "**Full Changelog**" link, and a body that ends
          # without one would lose a blank line the old hand-written bodies had.
          # The CR strip is the other half of that: .gitattributes stores these files as LF, but a
          # Windows checkout can hand back CRLF, and without this the body would mix CRLF (from the
          # notes file) with the LF this script writes.
          $body = "**What's new / 更新内容**`n`n" + $notes + "`n`n" + $tail + "`n"
          Set-Content -Path release-body.md -Value ($body -replace "`r`n", "`n") -Encoding utf8 -NoNewline
      - name: Release
        # Major-version tag on purpose: `v3` moves with each patch, which is how fixes arrive without
        # anyone bumping anything. There is no Dependabot; check the major and its release notes
        # before a release.
        uses: softprops/action-gh-release@v3
        with:
          # The packaging script supplies the installer, four ZIPs and checksums.
          draft: false
          make_latest: legacy
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.files }}
          # The body is composed by the step above: docs/release-notes/<tag>.md holds the
          # "What's new" bullets, and the package-picking note rides along underneath them. A
          # release cannot go out without its notes — the compose step fails if the file is
          # missing, which is the only reason v1.4.0 and v1.4.2 shipped with none.
          # Picking a package happens on the download page, not in the README, so the note has to
          # ride along with the release. GitHub appends the generated changelog after this body.
          # No sizes quoted here or in the READMEs: they move with every build and go stale silently,
          # while the release page shows each asset's actual size right next to its download button.
          body_path: release-body.md
          generate_release_notes: true
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir downloaded
          cd downloaded
          sha256sum --strict -c SHA256SUMS.txt

      # --- winget ------------------------------------------------------------------------------
      # **清单不归这个仓管** —— 它归 rockbenben/winget-manifests：那边的 apps.json 是唯一源，
      # 巡检到新 release 就重生成 manifest、往 winget-pkgs 开 PR。这个仓只管把 release 发出去。
      #
      # WARNING: **不要再在这里直接提交一份 manifest。** 两条路都往 winget-pkgs 开同一个包的 PR，
      # 第二个会被当重复拒掉，看起来就像「winget 坏了」。要改清单，改 apps.json 里那一项。
      #
      # WHICH ASSET: the SELF-CONTAINED zip, deliberately. winget picks an installer by
      # architecture / installer type / scope / locale — "bundles the .NET runtime or not" is not
      # one of those, so shipping both builds in one manifest gives the user no way to choose and
      # the second entry is simply unreachable. Of the three assets it is also the only viable one:
      # the bare QuickText.exe has no version in its name and winget requires a unique installer URL
      # per version. Self-contained over framework-dependent because winget's whole promise is "one
      # command and it runs", and its audience is exactly the "not sure which to pick" reader the
      # self-contained build already exists for; a missing runtime would surface as "installs fine,
      # won't start", which is far worse to diagnose than a larger download.
      # To switch to the small build later (not a one-way door — users move over on their next
      # winget upgrade): point the manifest at the -needs-dotnet10 zip and add to it
      #   Dependencies: { PackageDependencies: [ { PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10 } ] }
      # (verified present in the winget source; dependency handling is no longer an experimental
      # winget feature, but old winget clients on user machines still vary).
      #
      # 首次收录也走流水线的 PR：上游还没有这个包的 manifest 时，它被当作「新包」，流水线会开
      # 那个 PR。但社区仓对新包有额外校验，第一次可能要人工跟一下。
